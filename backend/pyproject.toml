[project]
name = "mpas-platform"
version = "0.1.0"
description = "M-PAS industrial pest management platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "PyJWT>=2.9,<3.0",
  "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
